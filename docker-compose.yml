services:
  frontend:
    build:  ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped
    # json-file defaults to no rotation at all. The containers are long-lived
    # now (the unit stops them rather than removing them), so nothing else ever
    # truncates these. 30MB ceiling per service.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./backend:/app
      # Defaults to /dev/null so `docker compose up` still boots with no
      # SHEETS_KEY_FILE_HOST set; sheets.py treats /dev/null as an unreadable
      # key file and skips sync (see requirements.md § Failure paths).
      - ${SHEETS_KEY_FILE_HOST:-/dev/null}:/run/secrets/sheets_key.json:ro
    environment:
      - SHEETS_SYNC_ENABLED=${SHEETS_SYNC_ENABLED:-false}
      - SHEETS_KEY_FILE=/run/secrets/sheets_key.json
      - SHEETS_SPREADSHEET_ID=${SHEETS_SPREADSHEET_ID:-}
      - SHEETS_TAB_NAME=${SHEETS_TAB_NAME:-Day}
    restart: unless-stopped
    # See the frontend service: uvicorn logs a line per request and nothing
    # rotates it otherwise.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
